name: Notificar vendas

on:
  repository_dispatch:
    types: [deposito]
  workflow_dispatch:
    inputs:
      mode:
        description: "test = mandar notificação de teste"
        default: test
        type: choice
        options: [test]

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --silent
      - name: Enviar notificação
        run: node check.mjs
        env:
          MODE: ${{ inputs.mode || 'deposito' }}
          AMOUNT: ${{ github.event.client_payload.amount }}
          CURRENCY: ${{ github.event.client_payload.currency }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          NOTIFY_TITLE: ${{ vars.NOTIFY_TITLE }}
          NOTIFY_BODY: ${{ vars.NOTIFY_BODY }}
          PUSH_SUB_1: ${{ secrets.PUSH_SUB_1 }}
          PUSH_SUB_2: ${{ secrets.PUSH_SUB_2 }}
          PUSH_SUB_3: ${{ secrets.PUSH_SUB_3 }}
          PUSH_SUB_4: ${{ secrets.PUSH_SUB_4 }}
          PUSH_SUB_5: ${{ secrets.PUSH_SUB_5 }}
